name: onshape-part
toolchain: python:3.12-slim
summary: |
  Parts designed natively in Onshape, with their feature history. The design lives in the
  project's Onshape Part Studio; codecrew records its feature list in
  design/onshape/features.json after every pass, and the checks read that file.
  - Work only in the Part Studio given in the task, through the Onshape tools.
  - Every dimension is a variable (#name, made with Variable features first) that sketches and
    features use: typed-in numbers fail the checks (0 and 90/180/360 degrees are fine).
  - Name each feature after what it does, not "Extrude 3".
  - After adding a feature, check its status: a feature that fails to regenerate fails the run.

setup: []
ignore: [.git/]

checks:
  - id: features
    run: python -B .codecrew/rulesets/onshape-part/check_features.py design/onshape/features.json
    parser:
      format: jsonl
      fields: { file: file, line: line, code: code, message: message, severity: severity }
    description: the recorded Onshape feature list (regeneration, variables, names)

repo_map:
  symbols: []

# Plan mode: what a plan for an Onshape part adds to codecrew's common core, and the checks
# on it. Proven by fixtures/plans/ (codecrew ruleset test).
plan:
  sections:
    - key: parameters
      title: Parameter table
      description: >-
        Every Onshape variable you will create (#name): its name, its value, the unit, and the
        rationale: why this value (what it mates with, the process limit, the load).
      columns: [name, value, unit, rationale]
    - key: interfaces
      title: Interfaces and mating dimensions
      description: >-
        What the part mates with and the dimensions that must fit: the mating part or fastener,
        the dimension, and the fit or clearance (M4 screw, hole_diameter_mm 4.5, clearance fit).
      columns: [mates_with, dimension, fit]
    - key: process_limits
      title: Process limits
      description: >-
        The manufacturing process and the limits it sets on this part, each with its value:
        minimum wall, overhang, smallest hole, tool radius, bend radius.
      columns: [limit, value]
    - key: targets
      title: Targets for size and mass
      description: >-
        The envelope the part must stay within and its mass target, each with the value the
        result is checked against (envelope 40 x 30 x 35 mm; mass under 15 g).
      columns: [quantity, target]
    - key: features
      title: Features, in order
      description: >-
        The feature history you will build after the Variable features, in order: each
        feature's name (after what it does), its type (Sketch, Extrude, Hole, Fillet, ...) and
        the dimensions it uses, written with the variables (#width, #height / 2). No typed-in
        numbers, except 0 and 90, 180, 270 or 360 deg.
      columns: [name, type, dimensions]
  checks:
    - id: parameter-unit-rationale
      kind: filled
      section: parameters
      column: name
      fields: [unit, rationale]
      message: "Variable '{value}' needs a unit and a rationale (why this value)."
    - id: feature-literal-dimension
      kind: pattern
      section: features
      column: dimensions
      # a number with a unit that isn't driven by a variable; 0 and the usual angles may stay
      forbid: '(?<![#\w.])(?!0+(?:\.0+)?\s*(?:mm|cm|m|in|deg)\b)(?!(?:90|180|270|360)\s*deg\b)\d+(?:\.\d+)?\s*(?:mm|cm|m|in|deg)\b'
      message: "Feature '{name}' uses a typed-in number ({value}): put it in a variable (parameters) and reference it as #name."
    - id: feature-unknown-variable
      kind: references
      section: features
      column: dimensions
      pattern: '#([A-Za-z_]\w*)'
      with_section: parameters
      with_column: name
      message: "Feature '{name}' uses #{value}, which isn't in the parameter table."
    - id: feature-default-name
      kind: pattern
      section: features
      column: name
      forbid: '^(Sketch|Extrude|Revolve|Fillet|Chamfer|Shell|Hole|Linear pattern|Circular pattern|Mirror|Sweep|Loft|Plane|Boolean|Split|Draft|Rib|Thicken)\s*\d*$'
      message: "Feature '{value}' has a default name: name it after what it does (e.g. 'Mounting holes')."


# What a project gives this ruleset, the guard its Onshape agents work under, and what codecrew
# records from the Part Studio after each pass (codecrew's ruleset hooks). The setting's
# context, onshape, is shared with the other rulesets that work in Onshape: a project gives the
# Part Studio once.
project_settings:
  - key: part_studio
    label: Onshape Part Studio
    description: >-
      The URL of the Part Studio the designer works in. Use a branch made for codecrew: the
      agent may change only that branch of that Part Studio, and codecrew refuses its calls
      anywhere else.
    example: https://cad.onshape.com/documents/575d0e8e00e2c9c9d8b82b8b/w/e7e34099a96b2c4d15e10345/e/93d3fcb70dc35800c131d028
    pattern: '^(?P<host>https?://[^/\s]+)/documents/(?P<document_id>[0-9a-f]{24})/w/(?P<workspace_id>[0-9a-f]{24})/e/(?P<element_id>[0-9a-f]{24})'
    context: onshape
    prompt: |-
      # Onshape
      You design in this Part Studio: {onshape.part_studio}
      document (did) {onshape.document_id}, branch (wvm w, wvmid) {onshape.workspace_id}, Part Studio (eid) {onshape.element_id}.
      Work only there: codecrew refuses calls to other documents, branches or elements. Read the server's guidance first (onshape_mcp_get_started, onshape_list_resources). Put every dimension in a variable (#name) and use it in sketches and features; name features after what they do; after each feature, check its status. codecrew records the feature list in design/onshape/features.json after your pass, and the checks read it.

guards:
  - key: design
    label: Onshape design guard
    description: >-
      For a generic Onshape API server (one tool, onshape_api_call, that reaches every
      endpoint): only Part Studio feature work, only in the project's Part Studio and branch.
      Operation names are Onshape's operationIds; if a call the agent needs is refused, add its
      name on the agent's page (a refused call lists the allowed ones).
    guard:
      tool: onshape_api_call
      # onshape-mcp's argument for the operation is "endpoint" (its ApiCallInput)
      allow:
        endpoint:
          - getPartStudioFeatures
          - getPartStudioFeatureSpecs
          - getPartStudioMassProperties
          - getPartStudioBoundingBoxes
          - getPartsWMVE
          - getPartStudioNamedViews
          - evalFeatureScript
          - addPartStudioFeature
          - updatePartStudioFeature
          - deletePartStudioFeature
          - updatePartStudioFeatures
      writes:
        endpoint: [addPartStudioFeature, updatePartStudioFeature, deletePartStudioFeature, updatePartStudioFeatures]
      # file_refs make the server read local files into the request: never needed for features
      forbid: [file_refs]
      pin:
        path_params.did: "{onshape.document_id}"
        path_params.wvmid|path_params.wid: "{onshape.workspace_id}"
        "?path_params.wvm": w
        path_params.eid: "{onshape.element_id}"

recorders:
  - id: features
    description: the Part Studio's feature list
    needs: [part_studio]
    tool: onshape_api_call
    calls:
      features:
        endpoint: getPartStudioFeatures
        path_params: { did: "{onshape.document_id}", wvm: w, wvmid: "{onshape.workspace_id}", eid: "{onshape.element_id}" }
    write: design/onshape/features.json
    require: features
    # fields of the feature list that change with every request, not with the design
    drop: [sourceMicroversion, microversionSkew, rejectMicroversionSkew, serializationVersion, libraryVersion, nodeId]
    count: features
    link: "{onshape.part_studio}"
  - id: properties
    description: what Onshape measures on the Part Studio (volume, mass, bounding box)
    needs: [part_studio]
    tool: onshape_api_call
    calls:
      mass:
        endpoint: getPartStudioMassProperties
        path_params: { did: "{onshape.document_id}", wvm: w, wvmid: "{onshape.workspace_id}", eid: "{onshape.element_id}" }
      box:
        endpoint: getPartStudioBoundingBoxes
        path_params: { did: "{onshape.document_id}", wvm: w, wvmid: "{onshape.workspace_id}", eid: "{onshape.element_id}" }
    # in mm, mm³ and g: to compare with another model
    run: python -B .codecrew/rulesets/onshape-part/properties.py {input}
    write: design/onshape/properties.json

agents:
  - key: designer
    label: Onshape designer
    instructions: >-
      You are a senior mechanical designer working directly in Onshape, through its API. Start
      every task by reading the server's guidance (onshape_mcp_get_started, then the resources
      on creating features and sketches). Think in design intent: what the part does, what it
      mates with, how it's made. Build the history so it's easy to change: Variable features
      first for every dimension, then sketches on the right planes, fully dimensioned with those
      variables, then features that use them. Name every feature after its purpose. After each
      feature, read the feature list and check that it regenerates; fix failures before moving
      on. Never touch other documents, branches or Part Studios. End with a short summary of the
      features you made and the variables that drive them.
    tools: [read_file, list_dir, search]
    write_scope: ["design/**"]
    max_turns: 60
    # plans first, and every plan waits for you: what it builds in Onshape can't be undone by git
    plan_mode: always_ask
  - key: reviewer
    label: Onshape design reviewer
    instructions: >-
      You review an Onshape part from its recorded feature list (design/onshape/features.json)
      like a senior mechanical engineer: does it do what the task asks, are fits, holes and
      walls right for the process, is the history easy to change (variables drive the
      dimensions, features are named and ordered sensibly)? Approve only what you'd release;
      otherwise give concrete findings with the feature and the value you'd use.
    tools: [read_file, list_dir, search]
    write_scope: []
    max_turns: 10
