name: freecad-model
# The same toolchain as freecad-part (FreeCAD's official AppImage, headless). Build it once:
#   docker build -t codecrew-freecad:1.1.3 freecad-part/toolchain
toolchain: codecrew-freecad:1.1.3
summary: |
  Parametric parts in FreeCAD 1.1 (headless, its Python 3.11), modelled with the person one
  step at a time. They decide; you model, render and show.
  - design/decisions.md holds the person's decisions. Read it before every step. What it doesn't
    decide, you don't either: ask with ask_user, with 2 or 3 options and what each costs or
    gains. Write into decisions.md only an answer the person gave you. Before the first step,
    when decisions.md has no decisions or the person asks for it, grill them first: load the
    skill grilling-a-design.
  - Do the step you were asked for, nothing more: one part, one joint, one assembly at a time.
  - parts/<name>.py: PARAMS, a frozen dataclass of the part's dimensions, each named with its
    unit (width_mm), and build(params) returning a Part.Shape. Optional: PRINTED = False for a
    part that isn't printed, RESTS_ON = "-z" (the face on the bed), DENSITY_G_CM3.
  - assemblies/<name>.py: build() returns {name: Part.Shape}, each in place: "<part>" or
    "<part>:<n>"; screws "standard:ISO 4762 M3x12:<n>" (standards.shapes.from_designation);
    a reference file by its name.
  - reference/<name>.step: what exists and the design must fit, written by a script in scripts/.
  - Numbers from the standards library, not from memory: from standards import fasteners;
    fasteners.clearance_hole("M3") is 3.4.
  - After every change to geometry, render it and look: render(target). Red is an overlap;
    screws show in blue through what hides them. Compare what you see with what you meant
    before you finish.
  - Import FreeCAD before Part. Select edges and faces by their geometry, never by index.
  - Errors stop a step: a part that doesn't build into a valid solid, a printed part larger than
    the bed in design/printer.toml, components that overlap, too little thread. Warnings (sharp
    edges, overhangs, thin walls) are for the person: name them, don't chase them.
  - When the person wants files to print: python -B scripts/export.py writes exports/<part>.stl
    and .step for every part.
  - When you finish a step, say what you made, what the checks say, what you saw in the render,
    and suggest the next step.

setup: []
ignore: [exports/, .git/, __pycache__/, .pytest_cache/, .ruff_cache/]

structure:
  - path: "parts/"
    allow: ["*.py"]
    message: "parts/ holds one Python module per part."
  - path: "assemblies/"
    allow: ["*.py"]
    message: "assemblies/ holds one Python module per assembly."
  - path: "reference/"
    allow: ["*.step", "*.stp"]
    message: "reference/ holds what exists and the design must fit, as STEP files."
  - path: "design/"
    allow: ["decisions.md", "printer.toml", "processes.toml", "*.md"]
    message: "design/ holds the person's decisions (decisions.md) and the printer (printer.toml)."
  - path: "tests/"
    allow: ["test_*.py", "conftest.py", "__init__.py"]
    message: "tests/ holds pytest files, optional (plus conftest.py)."

checks:
  - id: format
    fix: true
    run: python -m ruff format --quiet {files:*.py}
    description: ruff format, applied automatically
  - id: lint
    fix: true
    run: python -m ruff check --fix --quiet --output-format sarif {files:*.py}
    parser: sarif
    description: ruff (pyflakes, pycodestyle, bugbear, imports, pyupgrade)
  - id: model
    run: python -B .codecrew/rulesets/freecad-model/check.py
    timeout: 600
    parser:
      format: jsonl
      fields: { file: file, line: line, code: code, message: message, severity: severity }
    description: valid solids, fits the bed, nothing overlaps, enough thread; print warnings
  - id: test
    run: python -B -m pytest -q -rfE -p no:cacheprovider
    timeout: 600
    parser:
      format: lines
      pattern: '^(?P<severity>FAILED|ERROR) (?P<file>[^:\s]+)(?:::(?P<code>\S+))?(?: - (?P<message>.*))?$'
      code: test-file-error
      severity_map: { FAILED: error, ERROR: error }
    description: pytest, in FreeCAD's Python (tests are optional)

# The render tool: pictures of what's modelled, for the agent and the dashboard's preview.
render:
  run: python -B .codecrew/rulesets/freecad-model/render.py {target} --views {views}{focus} --json
  timeout: 300
  description: parts/<name>.py, assemblies/<name>.py or reference/<file>.step

repo_map:
  symbols:
    - files: "*.py"
      pattern: '^(?:def|class)\s+(?P<name>\w+)'

permissions:
  deny:
    - run_command(git push*)
    - run_command(git commit*)
    - run_command(git reset*)        # undoing a step is yours, in the session
  ask:
    - run_command(pip install *)
    - run_command(python -m pip install *)
  allow:
    - run_command(python *)
    - run_command(git status*)
    - run_command(git diff*)

agents:
  - key: modeller
    label: FreeCAD modeller
    models: [strong]
    model_note: >-
      One agent does every step, looking at its own renders: it needs a strong model that reads
      images well. A weak model here costs more in steps than it saves per token.
    instructions: >-
      You model what the person asks for, one step at a time, in FreeCAD's Python API (Part
      workbench). Their decisions are in design/decisions.md: follow them, and ask with ask_user
      when a step needs a decision that isn't there, rather than choosing. Load the skills when
      they apply: grilling-a-design before the first step, freecad-pitfalls before you write
      geometry, placing-parts-and-screws before an assembly, printing-basics for printed parts.
      Render after every change and look at the pictures. Keep every dimension in PARAMS.
    tools: [read_file, write_file, edit_file, list_dir, search, run_command, render, read_attachment]
    write_scope: ["design/**", "parts/**", "assemblies/**", "reference/**", "scripts/**", "tests/**", "README.md"]
    max_turns: 60
    plan_mode: "off"

pipelines:
  - key: modelling
    label: Modelling session
    description: >-
      You and one modeller, a step at a time: you ask for a step, it models and renders it, you
      look and decide. Each step is a commit; undo goes back one.
    final_review: false
    stages:
      - name: model
        agent: modeller
        kind: work
        session: true
        max_retries: 1
