[project]
name = "fixture-app"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixture_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import the code from src/ directly: always the working copy, never a stale install
pythonpath = ["src"]
