# Every ruleset must prove itself against its fixtures on every push.
name: rulesets
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruleset: [svelte-feature]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # codecrew's repository: adjust if it lives somewhere else.
      - run: uv tool install "codecrew @ git+https://github.com/zbouslikhin/codecrew#subdirectory=backend"
      - run: codecrew ruleset test ${{ matrix.ruleset }}
