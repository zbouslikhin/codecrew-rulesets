name: svelte-feature
# Image the checks run in (Docker sandbox). Must provide node + npm; the
# project's own node_modules (devDependencies below) supply the tools.
toolchain: node:22-bookworm

summary: |
  Svelte 5 + TypeScript, feature-folder architecture.
  - Code for a feature lives in src/features/<feature>/ with components/, http/, stores/,
    constants.ts, index.ts and types.ts.
  - Every component has its own folder: components/<Name>/<Name>.svelte + <Name>.module.scss,
    styles imported as a CSS module: `import styles from './<Name>.module.scss'`.
  - Import across folders with the '@/...' alias, never with '../'.
  - Type aliases are prefixed with T (TRelease, TCategory).
  - Every feature has at least one test (*.test.ts, Vitest + Testing Library), and the app
    must actually use every feature: it has to be reachable through imports from src/main.ts.
    A feature with passing tests that nothing renders fails the check.
  - Never edit *.generated.ts files; they are produced by tools.

# Each run works in a fresh git checkout without node_modules (it's git-ignored),
# so dependencies are installed once per run, inside the sandbox (Linux binaries).
setup:
  # npm ci is exact and fast; right after a ruleset update package-lock.json may not list
  # the new devDependencies yet, so fall back to npm install (commit the updated lock file).
  - "if [ -f package-lock.json ]; then npm ci --no-audit --no-fund || npm install --no-audit --no-fund; else npm install --no-audit --no-fund; fi"

# `make`/dashboard preview: runs the dev server on the run's workspace so you can
# try the result before approving. {port} is assigned by codecrew.
preview:
  command: node_modules/.bin/vite --host 0.0.0.0 --port {port} --strictPort
  ready_pattern: "ready in"

ignore: [node_modules/, .git/, dist/, build/, .svelte-kit/, .codecrew/]

structure:
  - path: "src/"
    allow: [basicComponents/, components/, dataDictionary/, features/, http/, types/, utils/,
            App.svelte, app.css, main.ts, "*.d.ts"]
  - path: "src/features/*/"
    name: camelCase
    allow: [components/, http/, stores/, constants.ts, index.ts, types.ts, "*.test.ts"]
    require: [index.ts, types.ts]
    require_any: ["**/*.test.ts"]
  - path: "src/features/*/components/"
    allow: ["*/"]
    message: "Each component lives in its own folder: components/<Name>/<Name>.svelte"
  - path: "src/features/*/components/*/"
    name: PascalCase
    allow: ["{dir}.svelte", "{dir}.module.scss", "{dir}.test.ts"]
    require: ["{dir}.svelte", "{dir}.module.scss"]

# {files} = files changed by the current stage (the whole repo for `codecrew check`).
# Formatters and linters use it so autofix never rewrites code the agent didn't touch.
# Structure, ast-grep and type checks always look at the whole repo.
# Every feature must be used by the app, not only exist (with passing tests).
reachability:
  - entry: [src/main.ts]
    require: "src/features/*/"
    aliases: { "@/": "src/" }

checks:
  - id: format
    fix: true
    run: node_modules/.bin/prettier --write --ignore-unknown --log-level warn {files}
    description: Prettier (tabs, single quotes), applied automatically
  - id: lint
    fix: true
    run: node_modules/.bin/eslint --fix --no-warn-ignored -f @microsoft/eslint-formatter-sarif {files}
    parser: sarif
    description: ESLint incl. no '../' imports and T-prefixed types in .svelte files
  - id: patterns
    run: node_modules/.bin/ast-grep scan --format sarif
    parser: sarif
    description: ast-grep rules in .codecrew/rulesets/svelte-feature/ast-grep (T-prefixed types in .ts files)
  - id: types
    run: node_modules/.bin/svelte-check --output machine --threshold error
    # svelte-check has no SARIF output: its "machine" format, described declaratively.
    parser:
      format: lines
      pattern: '^\d+ (?P<severity>ERROR|WARNING) "(?P<file>[^"]+)" (?P<line>\d+):(?P<column>\d+) "(?P<message>(?:[^"\\]|\\.)*)"'
      code: type-error
      severity_map: { ERROR: error, WARNING: warning }
      unescape: true
    description: svelte-check (TypeScript + Svelte type errors)
  - id: test
    # Vitest 5 writes its JSON report to a file, not stdout: write it outside the
    # project, print it, clean up. Two mappings: failed tests, and test files that
    # fail as a whole (e.g. an import that doesn't resolve).
    run: 'out="${TMPDIR:-/tmp}/codecrew-vitest-$$.json"; node_modules/.bin/vitest run --reporter=json --outputFile="$out" --passWithNoTests > /dev/null 2>&1; code=$?; cat "$out" 2>/dev/null; rm -f "$out"; exit $code'
    timeout: 600
    parser:
      format: json
      items: "testResults[].assertionResults[]"
      where: { status: failed }
      fields: { file: ../name, line: location.line, column: location.column, message: "failureMessages[0]", code: fullName }
      also:
        - format: json
          items: "testResults[]"
          where: { status: failed, message: "*" }
          fields: { file: name, message: message }
          code: test-file-error
    description: Vitest (Testing Library); every feature needs at least one test
  - id: build
    run: 'out="${TMPDIR:-/tmp}/codecrew-build-$$"; node_modules/.bin/vite build --logLevel error --outDir "$out" --emptyOutDir; code=$?; rm -rf "$out"; exit $code'
    timeout: 600
    description: vite build must succeed

# Plan mode: what a plan for this stack adds to codecrew's common core, and the checks on it.
# Proven by fixtures/plans/ (codecrew ruleset test).
plan:
  sections:
    - key: files
      title: Files
      description: >-
        Every file you will add, change or delete, with what it's for. change is add, modify
        or delete. (Files listed here needn't be repeated in the steps.)
      columns: [path, change, purpose]
      path_column: path
    - key: new_features
      title: New features
      description: >-
        Each feature folder you add under src/features/: its camelCase name, what it does, and
        where the app will use it (so it's reachable from src/main.ts). Empty when the task
        adds no feature.
      columns: [name, purpose, used_from]
      required: false
    - key: tests
      title: Tests
      description: >-
        The test files (*.test.ts) you add or extend, and what each proves. Empty only when no
        behaviour changes.
      columns: [path, covers]
      required: false
      path_column: path
    - key: interface_changes
      title: Interface changes
      description: >-
        Changes to what other code relies on: a feature's exports (index.ts), a component's
        props, a store's shape, an http function's signature. Empty when there are none.
      columns: [what, change, affects]
      required: false
      risk: true   # 'ask on risk' asks you before an interface changes
  checks:
    - id: feature-has-test
      kind: paired
      section: new_features
      column: name
      with_section: tests
      with_column: path
      template: "src/features/{value}/**/*.test.ts"
      message: "New feature '{value}' has no planned test: add a *.test.ts inside src/features/{value}/ to tests."
    - id: file-change
      kind: pattern
      section: files
      column: change
      require: '^(add|modify|delete)$'
      message: "files: '{path}' has change '{value}'; it must be add, modify or delete."
    - id: files-fit-structure
      kind: structure
      section: files
      column: path
      where: { change: add }
    - id: tests-fit-structure
      kind: structure
      section: tests
      column: path

# Agent templates for this stack (offered under "New agent" -> "Start from").
agents:
  - key: developer
    label: Svelte developer
    instructions: >-
      You are a senior Svelte 5 + TypeScript developer. Study the existing features first and
      follow their structure exactly. Every feature you add must be used by the app and have a
      test that renders it. Keep components small and styles in their CSS module.
    tools: [read_file, write_file, edit_file, delete_file, list_dir, search, run_command]
    write_scope: ["src/**"]
    max_turns: 40
    plan_mode: auto   # plans first; the plan checks decide (change it on the agent's page)
  - key: tester
    label: Svelte tester
    instructions: >-
      You write tests for what the earlier stages built: render components with Testing
      Library, do what a user does (click, type) and assert what they see. Cover the main path
      and the edge cases the request implies. Change only test files unless a test reveals a
      real bug.
    tools: [read_file, write_file, edit_file, list_dir, search, run_command]
    write_scope: ["src/**/*.test.ts"]
    max_turns: 30

# The repo map agents get up front: what each TypeScript file exports. Components are
# listed by their file (one component per file, named like its folder).
repo_map:
  symbols:
    - files: "*.ts"
      pattern: '^export\s+(?:default\s+)?(?:async\s+)?(?:function\*?|class|const|let|type|interface|enum)\s+(?P<name>[A-Za-z_$][\w$]*)'
    - files: "index.ts"
      pattern: '^export\s*\{\s*(?:default\s+as\s+)?(?P<name>[A-Za-z_$][\w$]*)'

